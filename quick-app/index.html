// ---- Terminology explanation helper ----
function explainTerm(term, map) {
  if (!term) return "";
  var text = String(term);
  if (map && map[term]) {
    var explanation = map[term];
    return "<span class=\"explain-term\" title=\"点击查看解释\" data-explain=\"" + esc(explanation) + "\">" + esc(text) + "</span>";
  }
  return esc(text);
}

// ---- Helpers ----
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function ml(v, kind) {
  if (v == null) return "—";
  if (kind === "popularity") {
    if (v > 8000) return "常见";
    if (v > 5000) return "适中";
    return "少见";
  }
  return String(Math.round(v * 100) / 100);
}

function readOptions() {
  const surname = surnameInput.value.trim() || "陈";

  const gender = genderBtn ? genderBtn.dataset.gender : "female";
  const bd = birthDate.value || "2024-06-27";
  const bt = birthTime.value || "09:30";

  const city = document.getElementById("locCity").value;
  const birthPlace = city ? (MUNICIPALITIES.has(prov) ? prov : city) : (prov || "");
  return { surname, gender, birthDate: bd, birthTime: bt, birthPlace, source: "any", count: 200 };
}

  // Header
  detName.textContent = item.full;
  detMeta.innerHTML =
    esc(item.pinyin) +
    " · <span>" +
    (o && o.gender === "male" ? "&#9794; 男" : o && o.gender === "female" ? "&#9792; 女" : "不限") +
    "</span>";

  detActions.innerHTML =
    '<button class="btn-fav' + (fav ? " faved" : "") + '" data-fav-key="' + esc(k) + '">' +
    (fav ? "&#9733; 已收藏" : "&#9734; 收藏") +
    "</button>" +
    (item.chars || [])
      .map(
        function (ch) {
          return '<button data-exclude="' + esc(ch.char) + '">排除「' + esc(ch.char) + "」</button>";
        }
      )
      .join("");

  // Body - build all detail sections
  detBody.innerHTML = buildDetailSections(item, o);

  // Section toggle
  detBody.querySelectorAll(".ds-header").forEach(function (hdr) {
    hdr.addEventListener("click", function () {
      const isOpen = hdr.classList.toggle("open");
      const content = hdr.nextElementSibling;
      if (content) {
        content.classList.toggle("open");
        // Trigger bar animation
        if (isOpen) {
          content.querySelectorAll(".wx-bar-fill").forEach(function (bar) {
            var w = bar.style.width;
            bar.style.width = "0%";
            setTimeout(function () { bar.style.width = w; }, 50);
          });
        }
      }
    });
  });

  detailOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

// ---- Generate ----
async function runGenerate() {
  lastOptions = readOptions();
  loader.classList.add("active");
  nameGrid.innerHTML = "";
  emptyState.style.display = "none";
  renderBS(lastOptions);

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...lastOptions, seed: Math.random() }),
    });
    const data = await res.json();
    let items = data.names || [];
    if (excludedChars.length) items = items.filter(function (i) { return ![...i.given].some(function (c) { return excludedChars.includes(c); }); });
    lastItems = items;
    resultsSection.classList.add("active");
    renderNames(items, lastOptions);
    window.scrollTo({ top: resultsSection.offsetTop - 20, behavior: "smooth" });
  } catch (e) {
    loader.classList.remove("active");
    nameGrid.innerHTML = '<div class="empty-state"><p>加载失败：' + esc(e.message) + "</p></div>";
  }
}

function sortAndRender() {
  var sortKey = document.getElementById("sortBy").value;
  var isAsc = document.getElementById("btnOrder").textContent.indexOf("\u5347\u5e8f") >= 0;
  var sorted = [].concat(lastItems).sort(function(a, b) {
    var va = a[sortKey] != null ? a[sortKey] : (a.scores ? (a.scores[sortKey] || 0) : 0);
    var vb = b[sortKey] != null ? b[sortKey] : (b.scores ? (b.scores[sortKey] || 0) : 0);
    return isAsc ? va - vb : vb - va;
  });
  lastItems = sorted;
  currentPage = 1;
  renderNames(lastItems, lastOptions);
}

// ---- Weight controls ----
function initWeights() {
  var saved = localStorage.getItem("babyname_weights");
  if (saved) { try { return JSON.parse(saved); } catch(e) {} }
  return { bazi:40, yinyun:20, meaning:12, gua:8, culture:20 };
}

function renderWeightSliders(weights) {
  var container = document.getElementById("weightSliders");
  var labels = { bazi:"八字喜用神", yinyun:"音韵声调", meaning:"字义内涵", gua:"周易卦象", culture:"经典文化" };
  var colors = { bazi:"#d44a3a", yinyun:"#3a7a9a", meaning:"#3a8a5a", gua:"#9a5a8a", culture:"#c49a4a" };
  container.innerHTML = Object.keys(labels).map(function(key) {
    var val = weights[key] || 0;
    return "<div class='ws-row'>" +
      "<div class='ws-label'><span style='display:inline-block;width:10px;height:10px;background:" + colors[key] + ";border-radius:50%;margin-right:6px'></span>" + labels[key] + "</div>" +
      "<input type='range' class='ws-slider' min='0' max='50' value='" + val + "' data-key='" + key + "'><input type='number' class='ws-number' min='0' max='50' value='" + val + "' data-key='" + key + "' style='width:50px;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-size:13px;text-align:center;outline:none'>" +
      "<span class='ws-value' id='ws-val-" + key + "'>" + val + "%</span>" +
      "</div>";
  }).join("");
}

// ---- Override readOptions to include weights ----
var _origReadOptions = readOptions;
readOptions = function() {
  var opts = _origReadOptions();
  opts.weights = initWeights();
  return opts;
};

// ---- Event delegation additions ----
document.addEventListener("click", function(e) {
  if (e.target.closest("#btnWeightApply")) { 
    // Read current slider values before applying
    var ws = document.querySelectorAll("#weightSliders .ws-number");
    var w = {};
    for (var wi = 0; wi < ws.length; wi++) {
      w[ws[wi].dataset.key] = Number(ws[wi].value) || 0;
    }
    localStorage.setItem("babyname_weights", JSON.stringify(w));
    document.getElementById("weightPanel").style.display = "none"; 
    runGenerate(); 
    return; 
  }
  if (e.target.closest("#btnShuffle")) { runGenerate(); return; }
  if (e.target.closest("#btnWeightToggle")) {
    var panel = document.getElementById("weightPanel");
    var isOpen = panel.style.display !== "none" && panel.style.display !== "";
    panel.style.display = isOpen ? "none" : "block";
    if (!isOpen) { renderWeightSliders(initWeights()); 
    // Attach live weight listeners
    setTimeout(function() {
      var sliders = document.querySelectorAll("#weightSliders .ws-slider, #weightSliders .ws-number");
      sliders.forEach(function(el) {
        el.addEventListener("input", function() {
          var key = this.dataset.key;
          var val = Number(this.value) || 0;
          var sibling = this.closest(".ws-row").querySelector(this.tagName === "INPUT" && this.type === "range" ? ".ws-number" : ".ws-slider");
          if (sibling) sibling.value = val;
          document.getElementById("ws-val-" + key).textContent = val + "%";
        });
      });
    }, 50);
  }
    return;
  }

  // Explain term tooltip
  if (e.target.closest(".explain-term")) {
    var et = e.target.closest(".explain-term");
    var explain = et.dataset.explain;
    if (explain) {
      var tip = document.getElementById("explainTooltip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "explainTooltip";
        tip.style.cssText = "position:fixed;background:#333;color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.6;max-width:320px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,0.25);pointer-events:none";
        document.body.appendChild(tip);
      }
      var rect = et.getBoundingClientRect();
      tip.textContent = explain;
      tip.style.display = "block";
      tip.style.left = Math.min(rect.left, window.innerWidth - 330) + "px";
      tip.style.top = (rect.bottom + 8) + "px";
    }
    return;
  }

});

document.addEventListener("input", function(e) {
  if (e.target.classList.contains("ws-slider")) {
    var key = e.target.dataset.key;
    var newVal = parseInt(e.target.value);
    var w = initWeights();
    var keys = Object.keys(w);
    var others = keys.filter(function(k) { return k !== key; });
    var otherTotal = 0;
    for (var i = 0; i < others.length; i++) { otherTotal += w[others[i]]; }
    if (otherTotal === 0) otherTotal = 1;
    var remaining = 100 - newVal;
    if (remaining < 0) remaining = 0;
    var scale = remaining / otherTotal;
    var sum = newVal;
    for (var i = 0; i < others.length; i++) {
      var k = others[i];
      var v = i === others.length - 1 ? Math.round(remaining - (sum - newVal)) : Math.round(w[k] * scale);
      if (v < 0) v = 0;
      w[k] = v;
      sum += v;
      var span = document.getElementById("ws-val-" + k);
      if (span) span.textContent = v + "%";
    }
    w[key] = newVal;
    if (sum !== 100) {
      var last = others[others.length - 1];
      w[last] += (100 - sum);
      var lastSpan = document.getElementById("ws-val-" + last);
      if (lastSpan) lastSpan.textContent = w[last] + "%";
    }
    var slider = e.target;
    var valSpan = document.getElementById("ws-val-" + key);
    if (valSpan) valSpan.textContent = newVal + "%";
    localStorage.setItem("babyname_weights", JSON.stringify(w));
    // Re-render sliders to update visual positions
    renderWeightSliders(w);
  }
});
